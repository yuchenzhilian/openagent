name: openagent
description: 端侧大模型 App — 基于 MNN-LLM 的 Flutter 跨平台多模态 LLM 应用。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # Local FFI plugin to MNN-LLM.
  mnn_llm:
    path: packages/mnn_llm
  # State management & routing.
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  # Storage & networking.
  dio: ^5.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  # UI.
  flutter_markdown: ^0.7.0
  # Multimodal input (image picker for gallery / camera).
  image_picker: ^1.1.0
  # Voice recording for multimodal models.
  record: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Force the record package family to a mutually compatible set. The default
# resolve (with record: ^5.1.0) keeps record_linux at 0.7.2 which is missing
# `startStream` + new optional-named `hasPermission` args, causing kernel
# snapshot (cross-platform AOT build) to fail even when targeting Android.
dependency_overrides:
  record: 7.1.1
  record_android: 2.1.2
  record_darwin: 1.2.2
  record_linux: 2.1.1
  record_platform_interface: 2.1.0
  # record_use 1.0+ requires meta ^1.19.0 which conflicts with flutter_test pin
  # (meta 1.18.0). 0.6.0 has no start-of-record change and works with old meta.
  record_use: 0.6.0
  record_web: 2.1.2
  record_windows: 2.2.3

flutter:
  uses-material-design: true
  assets:
    - tools/model_list.json
