name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # ---- Download MNN prebuilt libraries ----
      # The download script fetches prebuilt .so files + headers from
      # GitHub Releases (MNN 3.6.1), so no NDK / source build is needed.
      - name: Cache MNN prebuilt
        id: cache-mnn
        uses: actions/cache@v4
        with:
          path: packages/mnn_llm/third_party/mnn/android/arm64-v8a
          key: mnn-android-arm64-${{ hashFiles('packages/mnn_llm/scripts/download_mnn_prebuilt.sh') }}

      - name: Download MNN prebuilt
        if: steps.cache-mnn.outputs.cache-hit != 'true'
        run: |
          chmod +x packages/mnn_llm/scripts/download_mnn_prebuilt.sh
          bash packages/mnn_llm/scripts/download_mnn_prebuilt.sh

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openagent-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
