name: mnn_llm
description: Flutter FFI plugin for on-device LLM inference, powered by Alibaba MNN-LLM engine. Supports streaming text generation, sampling configuration, and cancellation — fully offline.
version: 0.1.0
homepage: https://github.com/your-name/openagent
repository: https://github.com/your-name/openagent/tree/main/packages/mnn_llm

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  ffi: ^2.1.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
