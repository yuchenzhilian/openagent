# ffigen configuration: generates Dart bindings for mnn_llm_capi.h.
# Run: dart run ffigen
output:
  bindings_type: dart
  dart:
    path: lib/mnn_llm_bindings_generated.dart
    structure: single_file

name: MnnLlmBindings

description: Native bindings for MNN-LLM C API.

headers:
  entry-points:
    - src/mnn_llm_capi.h
  include-directives:
    - src/mnn_llm_capi.h

compiler-opts:
  - '-Isrc'

# PDB-style typedefs are already C, no include transitively needed.
enums:
  dependency-only: full

preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND.
  // Generated by ffigen from src/mnn_llm_capi.h.
