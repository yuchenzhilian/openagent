// Android Gradle build for the mnn_llm FFI plugin.
//
// Flutter's `ffiPlugin` mechanism (declared in pubspec.yaml) pulls this
// module in as a library subproject. The externalNativeBuild block below
// tells Gradle to compile the C/C++ sources via CMake and package the
// resulting libmnn_llm.so (plus its dependency libMNN.so) into the APK,
// so Dart FFI can load it with DynamicLibrary.open('libmnn_llm.so').
group 'com.openagent.mnn_llm'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.openagent.mnn_llm'
    compileSdk 34

    defaultConfig {
        minSdk 28
        // arm64-v8a is the only ABI MNN-LLM ships for; armeabi-v7a lacks
        // the NEON/A-arm82 support the LLM kernels require.
        ndk {
            abiFilters 'arm64-v8a'
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    // libMNN.so / libllm.so / libMNN_Express.so are prebuilt IMPORTED
    // libraries (not built by CMake), so externalNativeBuild will NOT package
    // them automatically. Add their directory to jniLibs so they land in
    // lib/arm64-v8a/ inside the APK; otherwise dlopen("libmnn_llm.so") fails
    // at runtime with an unsatisfied-link error.
    sourceSets {
        main {
            jniLibs.srcDirs += ["${projectDir}/../third_party/mnn/android"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
