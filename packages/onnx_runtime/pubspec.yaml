name: onnx_runtime
description: ONNX Runtime Mobile Flutter plugin for on-device ML inference.
version: 0.1.0
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.openagent.onnxruntime
        pluginClass: OnnxRuntimePlugin
      ios:
        pluginClass: OnnxRuntimePlugin